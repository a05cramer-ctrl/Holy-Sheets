<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOLY SHEETS</title>
<meta name="description" content="Every ghost is just a sheet with two holes. $SHEETS on Solana.">
<meta property="og:title" content="HOLY SHEETS">
<meta property="og:description" content="Every ghost is just a sheet with two holes.">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#120726">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>:root {
  --night: #120726;
  --lav: #ece8ff;
  --neon: #bcd8ff;
  --violet: #7c5cff;
  --ink: #0b0718;
  --glass: rgba(18, 7, 40, 0.58);
  --line: rgba(188, 216, 255, 0.32);
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --px: "Silkscreen", ui-monospace, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overflow-x: clip;
  background: #fff; color: var(--lav); font-family: var(--ui);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
body.night { background: var(--night); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }

#gl, #page { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { z-index: 1; touch-action: none; outline: none; background: #000; }
#page { z-index: 5; transition: opacity .2s ease; touch-action: manipulation; cursor: default; background: #fff; }
#page.gone { opacity: 0; pointer-events: none; }
body.page-click #page { cursor: pointer; }

/* ---------- HUD ---------- */
.hud {
  position: fixed; z-index: 10; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
  opacity: 0; transform: translateY(-8px); pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
.foot {
  position: fixed; z-index: 10; left: 0; right: 0; bottom: 0;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: 0 16px max(14px, env(safe-area-inset-bottom));
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity .6s ease .1s, transform .6s ease .1s;
}
body.hud-on .hud, body.hud-on .foot { opacity: 1; transform: none; }
body.hud-on .hud > *, body.hud-on .foot > * { pointer-events: auto; }

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--lav); min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 0 1px var(--line), 0 0 18px rgba(124, 92, 255, .55); }
.bw { font-family: var(--px); font-weight: 700; font-size: 14px; letter-spacing: .03em; white-space: nowrap; text-shadow: 0 0 12px rgba(188, 216, 255, .55); }
.acts { display: flex; align-items: center; gap: 8px; }
.ib {
  width: 38px; height: 38px; display: grid; place-items: center; flex: none;
  border-radius: 11px; background: var(--glass); border: 1px solid var(--line); color: var(--lav);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; padding: 0;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.ib svg { width: 18px; height: 18px; }
.ib:hover, .ib:focus-visible { border-color: rgba(188, 216, 255, .75); box-shadow: 0 0 16px rgba(188, 216, 255, .35); outline: none; }
#snd .wv { display: none; }
#snd.on .wv { display: inline; }
#snd.on .mute { display: none; }
.buy {
  height: 38px; display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; flex: none;
  border-radius: 11px; background: var(--lav); color: #140826; text-decoration: none;
  font-family: var(--px); font-weight: 700; font-size: 13px; text-transform: uppercase; white-space: nowrap;
  box-shadow: 0 0 0 1px #fff inset, 0 0 22px rgba(188, 216, 255, .6), 0 0 60px rgba(124, 92, 255, .32);
  transition: transform .15s, box-shadow .15s;
}
.buy:hover, .buy:focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 1px #fff inset, 0 0 30px rgba(188, 216, 255, .85), 0 0 70px rgba(124, 92, 255, .45); outline: none; }

.tag { margin: 0; font-size: 13px; line-height: 1.4; color: rgba(236, 232, 255, .74); max-width: 270px; }
.ctl { display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.chip {
  height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; max-width: 100%;
  border-radius: 10px; background: var(--glass); border: 1px solid var(--line); color: var(--lav);
  font: 500 12.5px var(--ui); cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.chip .k { font-family: var(--px); font-size: 11px; color: var(--neon); }
#caTxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { font-size: 12.5px; color: rgba(236, 232, 255, .62); }
.key {
  height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
  border-radius: 10px; background: rgba(236, 232, 255, .1); border: 1px solid var(--line); border-bottom-width: 3px;
  color: var(--lav); font: 600 12px var(--ui); cursor: pointer;
}
.key svg { width: 16px; height: 16px; }
.key:hover, .chip:hover { border-color: rgba(188, 216, 255, .7); }

.caption {
  position: fixed; z-index: 11; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
  width: min(92vw, 760px); text-align: center; pointer-events: none;
  font-family: var(--px); font-weight: 700; color: #fff; font-size: clamp(20px, 3.4vw, 34px); line-height: 1.1;
  text-shadow: 0 0 18px rgba(188, 216, 255, .85), 0 0 46px rgba(124, 92, 255, .75);
  opacity: 0; transition: opacity .25s ease, transform .25s ease;
}
.caption small { display: block; margin-top: 10px; font: 500 15px var(--ui); color: rgba(236, 232, 255, .9); text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.caption.in { opacity: 1; transform: translate(-50%, 0); }

.bubble {
  position: fixed; z-index: 11; left: 0; top: 0; padding: 8px 12px 7px;
  background: #fff; color: var(--ink); font-family: var(--px); font-weight: 700; font-size: 17px; line-height: 1;
  box-shadow: 0 0 0 2px var(--ink), 0 0 26px rgba(188, 216, 255, .7);
  pointer-events: none; opacity: 0; transition: opacity .15s ease; will-change: transform;
}
.bubble::after { content: ""; position: absolute; left: 12px; bottom: -9px; width: 10px; height: 10px; background: #fff; clip-path: polygon(0 0, 100% 0, 0 100%); }
.bubble.in { opacity: 1; }

.redo {
  position: fixed; z-index: 12; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  height: 42px; padding: 0 18px; border: 0; border-radius: 8px; background: #303030; color: #fff;
  font: 500 14px var(--ui); box-shadow: 0 6px 22px rgba(0, 0, 0, .28); cursor: pointer; white-space: nowrap;
}
.toast {
  position: fixed; z-index: 13; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px);
  padding: 10px 16px; border-radius: 10px; background: rgba(14, 6, 30, .92); border: 1px solid var(--line); color: var(--lav);
  font: 500 13.5px var(--ui); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; white-space: nowrap;
}
.toast.in { opacity: 1; transform: translate(-50%, 0); }

/* ---------- no-WebGL fallback ---------- */
.fb {
  position: fixed; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
  background: radial-gradient(120% 80% at 50% 110%, #3a1872 0%, #1f0a3f 45%, #0d0420 100%);
}
body.nogl .fb { display: flex; }
body.nogl #gl { display: none; }
.fb-title { font-family: var(--px); font-weight: 700; font-size: clamp(40px, 10vw, 120px); line-height: .95; text-align: center; color: #f4f0ff; text-shadow: 0 0 30px rgba(150, 110, 255, .9); }
.fb-ghost img { width: min(46vw, 300px); height: auto; border-radius: 24px; display: block; box-shadow: 0 0 0 2px rgba(188, 216, 255, .6), 0 0 60px rgba(124, 92, 255, .6); animation: fbfloat 3.2s ease-in-out infinite; }
@keyframes fbfloat { 50% { transform: translateY(-12px); } }
body.nogl .hint { display: none; }

@media (max-width: 640px) {
  .hud { padding-left: 12px; padding-right: 12px; }
  .bw { font-size: 12px; }
  .acts { gap: 6px; }
  .ib { width: 36px; height: 36px; }
  #chartLink { display: none; }
  .buy { height: 36px; padding: 0 12px; font-size: 12px; }
  .foot { flex-direction: column; align-items: stretch; gap: 8px; padding-left: 12px; padding-right: 12px; }
  .tag { display: none; }
  .ctl { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .hint { grid-column: 1 / -1; order: -1; text-align: center; font-size: 12px; }
  .chip { max-width: 100%; justify-self: start; }
}
@media (max-width: 420px) { .bw { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1 class="sr">HOLY SHEETS ($SHEETS) on Solana. Every ghost is just a sheet with two holes.</h1>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="fb" class="fb" aria-hidden="true">
  <div class="fb-title">HOLY<br>SHEETS</div>
  <div class="fb-ghost"><img src="avatar.png" alt=""></div>
</div>

<canvas id="page" role="img" aria-label="a spreadsheet called holy_sheets. two cells get cut out, and the sheet gets up."></canvas>

<header class="hud" id="hud">
  <a class="brand" href="#" id="brand" aria-label="HOLY SHEETS — put the sheet back">
    <img src="avatar.png" alt="" width="34" height="34">
    <span class="bw">HOLY SHEETS</span>
  </a>
  <nav class="acts" aria-label="links">
    <a id="chartLink" class="ib" href="#" aria-label="chart">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16h14M5 13l3.5-4 3 2.5L16 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="square" stroke-linejoin="miter"/></svg>
    </a>
    <a id="xLink" class="ib" href="#" aria-label="X">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L1.9 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z" fill="currentColor"/></svg>
    </a>
    <button id="snd" class="ib" type="button" aria-pressed="false" aria-label="sound off, turn on">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path class="wv" d="M13 7.5c1 1.4 1 3.6 0 5M15.4 5.5c2 2.6 2 6.4 0 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="mute" d="M13 7.5l4 5M17 7.5l-4 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <a id="buy" class="buy" href="#">buy <span data-ticker>$SHEETS</span></a>
  </nav>
</header>

<footer class="foot" id="foot">
  <p class="tag">every ghost is just a sheet with two holes.</p>
  <div class="ctl">
    <button id="caChip" class="chip" type="button" aria-label="copy contract address"><span class="k">CA</span><span id="caTxt">drops at launch</span></button>
    <span class="hint" id="hint">drag the sheet · tap to boo</span>
    <button id="undo" class="key" type="button" aria-label="undo: put the sheet back">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 3.5 8.5 7 12M4 8.5h8a4 4 0 0 1 0 8H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ctrl+z</span>
    </button>
  </div>
</footer>

<div id="caption" class="caption" role="status" aria-live="polite" hidden></div>
<div id="bubble" class="bubble" aria-hidden="true" hidden>boo.</div>
<button id="redo" class="redo" type="button" hidden>↷ redo — tap anywhere</button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
